name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install

      - name: Build web app and prepare dist
        run: |
          bun run build
          echo "=== Build done, listing root ==="
          ls -la
          if [ -d ".output/public" ]; then
            echo "Found .output/public, copying to dist"
            mkdir -p dist
            cp -r .output/public/. dist/
          fi
          if [ ! -d "dist" ]; then
            echo "ERROR: dist not found" && exit 1
          fi
          echo "dist contents:" && ls dist/
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing" && exit 1
          fi
          echo "dist/index.html OK - ready for Capacitor"
        env:
          VITE_BASE: /

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.askpintuai.heartbeatconnect",
            "appName": "HeartbeatConnect",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          cat capacitor.config.json

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
