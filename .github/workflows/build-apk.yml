name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build
        env:
          VITE_BASE: /

      - name: Detect build output dir
        id: outdir
        run: |
          if [ -d ".output/public" ]; then echo "dir=.output/public" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then echo "dir=dist" >> $GITHUB_OUTPUT
          else echo "No build output found" && exit 1; fi

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: bunx cap init "Heartbeat Connect" "com.askpintuai.heartbeatconnect" --web-dir ${{ steps.outdir.outputs.dir }}

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
